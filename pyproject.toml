[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-env-doctor"
version = "0.1.0a1"
description = "Terminal-Bench environment preflight and failure attribution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-env-doctor contributors" }]
keywords = ["ai-agents", "terminal-bench", "evaluation", "docker", "benchmark"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0"]

[project.scripts]
agent-env-doctor = "agent_env_doctor.cli:app"

[project.urls]
Homepage = "https://github.com/ywh0606/agent-env-doctor"
Repository = "https://github.com/ywh0606/agent-env-doctor"
Issues = "https://github.com/ywh0606/agent-env-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_env_doctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
